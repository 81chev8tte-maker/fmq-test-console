name: CI

on:
  push:
    branches: [main, g1-vite-port]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run build
      - name: Verify GitHub Pages base path
        run: node -e "const fs=require('fs'); const html=fs.readFileSync('dist/index.html','utf8'); if(!html.includes('/fmq-test-console/assets/')) process.exit(1)"
      - uses: actions/upload-artifact@v4
        with:
          name: github-pages-candidate
          path: dist
          if-no-files-found: error
